server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Serve React SPA — never cache index.html so Cloudflare Access can intercept
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ES modules (.mjs) — nginx's default mime map serves these as
    # application/octet-stream, which browsers reject for module workers.
    # Force a JavaScript type so the pdf.js worker loads.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache-bust hashed assets forever
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy all API routes to FastAPI
    location ~ ^/(chat|sessions|topics|tasks|auth|emails|files|reflect|push|feedback|health) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Required for SSE streaming (chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
